{% extends "base.html" %}
{% block content %}
<h1>{{ t('updates_title') }}</h1>
<div class="card">
    <p>{{ t('updates_current_version') }} <strong>{{ current_version }}</strong></p>
    <p class="small-note">{{ t('updates_intro') }}</p>
    <form method="post" enctype="multipart/form-data">
        <label>{{ t('updates_field_package') }}</label>
        <input type="file" name="package" accept=".zip" required>
        <button type="submit">{{ t('updates_submit') }}</button>
    </form>
</div>

{% if backups %}
<div class="card">
    <h2>{{ t('updates_backups_h2') }}</h2>
    <ul>
        {% for b in backups %}
        <li class="small-note">{{ b }}</li>
        {% endfor %}
    </ul>
</div>
{% endif %}
{% endblock %}
