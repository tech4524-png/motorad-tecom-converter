{% extends "base.html" %}
{% block content %}
<div class="login-box">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="Motorad" class="login-logo" onerror="this.style.display='none'">
    <h1 class="app-name">{{ t('login_title') }}</h1>
    <p class="app-tagline">{{ t('app_tagline') }}</p>
    <h2 class="login-subtitle">{{ t('login_subtitle') }}</h2>
    <form method="post">
        <label>{{ t('login_username') }}</label>
        <input type="text" name="username" required autofocus>
        <label>{{ t('login_password') }}</label>
        <input type="password" name="password" required>
        <button type="submit">{{ t('login_submit') }}</button>
    </form>
    <div class="login-lang">
        <span class="small-note">{{ t('language_label') }}:</span>
        {% include "_lang_switcher.html" %}
    </div>
</div>
{% endblock %}
