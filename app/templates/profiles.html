{% extends "base.html" %}
{% block content %}
<h1>{{ t('profiles_title') }}</h1>
<p class="small-note">{{ t('profiles_intro') }}</p>

{% for profile in cfg.profiles %}
<div class="card">
    <h2>{{ profile.display_name }} ({{ profile.id }})</h2>
    <form method="post">
        <input type="hidden" name="profile_id" value="{{ profile.id }}">
        <div class="grid-2">
            <div>
                <label>{{ t('profiles_field_input_dir') }}</label>
                <input type="text" name="input_dir" value="{{ profile.input_dir }}" placeholder="C:\Motorad\TECOM\input">
                <label>{{ t('profiles_field_output_dir') }}</label>
                <input type="text" name="output_dir" value="{{ profile.output_dir }}" placeholder="C:\Motorad\TECOM\output">
            </div>
            <div>
                <label>{{ t('profiles_field_archive_dir') }}</label>
                <input type="text" name="archive_dir" value="{{ profile.archive_dir }}" placeholder="C:\Motorad\TECOM\archive">
                <label>{{ t('profiles_field_error_dir') }}</label>
                <input type="text" name="error_dir" value="{{ profile.error_dir }}" placeholder="C:\Motorad\TECOM\errors">
            </div>
        </div>
        <label style="display:inline-flex; align-items:center; gap:0.4rem; margin-top:0.8rem;">
            <input type="checkbox" name="enabled" {% if profile.enabled %}checked{% endif %} style="width:auto;">
            {{ t('profiles_field_enabled') }}
        </label>
        <br>
        <button type="submit">{{ t('profiles_save') }}</button>
    </form>
</div>
{% endfor %}
{% endblock %}
